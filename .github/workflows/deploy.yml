name: Deploy

# Runs after CI passes on main. Needs Workload Identity Federation set up for this repo:
#   vars.GCP_WIF_PROVIDER  projects/228506430673/locations/global/workloadIdentityPools/github/providers/github
#   vars.GCP_DEPLOY_SA     deployer@revuu-510915.iam.gserviceaccount.com
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: revuu-510915
  REGION: asia-southeast1
  SERVICE: revuu-web
  IMAGE: asia-southeast1-docker.pkg.dev/revuu-510915/revuu/web

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build and push
        id: image
        run: |
          ref="$IMAGE:$(git rev-parse --short=12 HEAD)"
          docker build --platform linux/amd64 -t "$ref" .
          docker push "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.image.outputs.ref }}
